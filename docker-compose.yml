services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-memoryboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-memoryboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 应用连数据库用服务名 db 作主机
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-memoryboard}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me}
      UPLOAD_DIR: public/uploads
      # 注册口令：设了则注册需口令，留空则开放注册
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      # 站长邮箱：只有这个账号能看到并使用备份功能
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # WebDAV 备份，三个都填了才启用
      WEBDAV_URL: ${WEBDAV_URL:-}
      WEBDAV_USER: ${WEBDAV_USER:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
    ports:
      - "3100:3000"
    volumes:
      # 图片持久化到命名卷，容器重建也不丢
      - uploads:/app/public/uploads

volumes:
  db_data:
  uploads:
